server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri /index.html;
	}

	# Same-origin API: proxy to the orchestrator service (ADR 0001, REST+SSE).
	location /runs {
		proxy_pass http://orchestrator:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection "";
		# SSE: no buffering, no timeout on idle streams.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
	}
}
